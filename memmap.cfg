# ca65 linker config for 128K SMC

# Physical areas of memory
# Names need not match, but it makes it easier to remember if they do.
MEMORY {
    ZEROPAGE:   start =      0, size =  $100;
    BSS:        start =   $200, size = $1800;
		RAM0:       start = $7E2000, size =  $E000;
    RAM1:       start = $7F0000, size = $10000;
		BANK0:			start = $C00000, size = $8000, fill = yes;
    ROM:        start = $C08000, size = $8000, fill = yes;
    BANK1:      start = $C18000, size = $10000, fill = yes;
    BANK2:      start = $C28000, size = $10000, fill = yes;
    BANK3:      start = $C38000, size = $10000, fill = yes;
}

# Logical areas code/data can be put into.
SEGMENTS {
    ZEROPAGE:   load = ZEROPAGE,    type = zp;
    BSS:        load = BSS,         type = bss, align = $100;

    CODE:       load = ROM,         align = $8000;
    RODATA:     load = ROM;
    HEADER:     load = ROM,         start =  $C0FFC0;
    ROMINFO:    load = ROM,         start =  $C0FFD5, optional = yes;
    VECTORS:    load = ROM,         start =  $C0FFE0;

    # The extra three banks
		BANK0:			load = BANK0,				optional = yes;
    BANK1:      load = BANK1,       optional = yes;
    BANK2:      load = BANK2,       optional = yes;
    BANK3:      load = BANK3,       optional = yes;
}
